name: TV ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure personal release signing
        env:
          TV_SIGNING_JSON: ${{ secrets.TV_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          from pathlib import Path
          data = json.loads(os.environ['TV_SIGNING_JSON'])
          key = Path(os.environ['RUNNER_TEMP']) / 'tv-release.jks'
          key.write_bytes(base64.b64decode(data['keystore']))
          props = 'storeFile=' + str(key) + '\n'
          for name in ('storePassword', 'keyPassword', 'keyAlias'):
              props += name + '=' + data[name] + '\n'
          Path('simple_live_tv_app/android/key.properties').write_text(props)
          PY
      - name: Resolve dependencies
        working-directory: simple_live_tv_app
        run: flutter pub get
      - name: Build ARM64 release APK
        working-directory: simple_live_tv_app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify APK signature and architecture
        run: |
          APK=simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion:|targetSdkVersion:|native-code:'
          sha256sum "$APK" > "$APK.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: tv-arm64-apk
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
